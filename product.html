<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — shop-X</title>
  <link rel="stylesheet" href="/Css/style.css">
  <link rel="stylesheet" href="/Css/components.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="/index.html" class="logo">shop<span>X</span></a>
      <div class="header-search">
        <input type="text" id="header-search-input" placeholder="Search products...">
        <button class="search-btn" id="header-search-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
      </div>
      <nav class="header-nav">
        <a href="/products.html">Products</a>
        <a href="/cart.html" class="cart-link" data-auth-show style="display:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          Cart <span class="cart-badge" style="display:none">0</span>
        </a>
        <a href="/profile.html" data-auth-show style="display:none"><span data-user-name>Account</span></a>
        <a href="/login.html" data-guest-show>Sign In</a>
        <a href="/register.html" class="btn btn-primary btn-sm" data-guest-show>Register</a>
      </nav>
      <button class="btn-menu" id="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="/index.html" class="logo" style="margin-bottom:20px;display:block">shop<span style="color:var(--c-brand)">X</span></a>
    <a href="/products.html">🛍️ Products</a>
    <a href="/cart.html" data-auth-show style="display:none">🛒 Cart</a>
    <a href="/orders.html" data-auth-show style="display:none">📦 My Orders</a>
    <a href="/login.html" data-guest-show>🔑 Sign In</a>
    <a href="#" data-logout data-auth-show style="display:none">🚪 Logout</a>
  </div>
</div>

<div id="product-page-content">
  <div class="loading-spinner"></div>
</div>

<!-- Related Products -->
<section class="section" id="related-section" style="display:none">
  <div class="container">
    <div class="section-header">
      <h2 class="section-title">Related Products</h2>
    </div>
    <div class="products-grid" id="related-products"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2025 shop-X. All rights reserved.</span>
    </div>
  </div>
</footer>

<script type="module">
  import { fetchProduct, getImageUrl } from '/Js/appwrite.js';
  import { initAuth, setupLogoutButtons } from '/Js/auth.js';
  import { handleAddToCart, getCart } from '/Js/cart.js';
  import { renderProductGrid } from '/Js/products.js';
  import { renderStars, formatPrice, showToast, setupMobileMenu, setupStickyHeader, updateCartBadge } from '/Js/ui.js';

  let user = null;
  let product = null;
  let qty = 1;

  async function init() {
    setupMobileMenu();
    setupStickyHeader();
    user = await initAuth();
    setupLogoutButtons();
    if (user) { const cart = await getCart(user.$id); updateCartBadge(cart.count); }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) { window.location.href = '/products.html'; return; }

    const container = document.getElementById('product-page-content');
    try {
      product = await fetchProduct(id);
      document.title = `${product.title} — shop-X`;
      const img = getImageUrl(product.image);
      const discount = product.originalPrice ? Math.round((1 - product.price / product.originalPrice) * 100) : 0;

      container.innerHTML = `
        <div class="page-header">
          <div class="container">
            <div class="breadcrumb">
              <a href="/index.html">Home</a> ›
              <a href="/products.html">Products</a> ›
              <a href="/products.html?category=${product.category}">${product.category}</a> ›
              ${product.title}
            </div>
          </div>
        </div>
        <div class="section">
          <div class="container">
            <div class="product-detail-layout">
              <div class="product-images">
                <div class="product-main-img" id="main-img-wrap">
                  <img src="${img}" alt="${product.title}" id="main-product-img">
                </div>
                <div class="product-thumbs" id="product-thumbs">
                  <div class="product-thumb active" data-img="${img}">
                    <img src="${img}" alt="${product.title}">
                  </div>
                </div>
              </div>
              <div class="product-info">
                <div class="product-category-tag">${product.category}</div>
                <h1 class="product-title">${product.title}</h1>
                <div class="product-stars">
                  ${renderStars(product.rating || 0)}
                  <span class="rating-count">${product.reviewCount || 0} reviews</span>
                </div>
                <div class="product-price-wrap">
                  <span class="product-price">${formatPrice(product.price)}</span>
                  ${product.originalPrice ? `<span class="product-original-price">${formatPrice(product.originalPrice)}</span>` : ''}
                  ${discount > 0 ? `<span class="product-discount-badge">-${discount}%</span>` : ''}
                </div>
                <p class="product-desc">${product.description || 'No description available.'}</p>
                <div class="stock-indicator ${product.stock > 0 ? 'in-stock' : 'out-stock'}">
                  ${product.stock > 0 ? `✓ In Stock (${product.stock} available)` : '✕ Out of Stock'}
                </div>
                <div class="product-qty-wrap">
                  <span style="font-weight:600;font-size:14px">Quantity:</span>
                  <div class="qty-control">
                    <button class="qty-btn" id="qty-minus">−</button>
                    <span class="qty-value" id="qty-display">1</span>
                    <button class="qty-btn" id="qty-plus">+</button>
                  </div>
                </div>
                <div class="product-actions">
                  <button class="btn btn-primary" id="add-to-cart-btn" ${product.stock === 0 ? 'disabled' : ''}>
                    🛒 Add to Cart
                  </button>
                  <button class="btn btn-outline" id="buy-now-btn" ${product.stock === 0 ? 'disabled' : ''}>
                    ⚡ Buy Now
                  </button>
                </div>
                <div style="margin-top:24px;padding:16px;background:#f9fafb;border-radius:12px;font-size:13px;color:#6b7280">
                  <div style="display:flex;gap:20px;flex-wrap:wrap">
                    <span>🚚 Free shipping over $50</span>
                    <span>↩️ 30-day returns</span>
                    <span>🔒 Secure checkout</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>`;

      // Qty controls
      const qtyDisplay = document.getElementById('qty-display');
      document.getElementById('qty-minus').addEventListener('click', () => {
        if (qty > 1) { qty--; qtyDisplay.textContent = qty; }
      });
      document.getElementById('qty-plus').addEventListener('click', () => {
        if (qty < product.stock) { qty++; qtyDisplay.textContent = qty; }
      });

      // Add to cart
      document.getElementById('add-to-cart-btn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        if (!user) { window.location.href = `/login.html?redirect=${window.location.pathname}${window.location.search}`; return; }
        btn.disabled = true; btn.textContent = 'Adding...';
        const { addToCart } = await import('/Js/appwrite.js');
        const { clearCartCache } = await import('/Js/cart.js');
        try {
          await addToCart(user.$id, product.$id, qty);
          clearCartCache();
          const { getCart } = await import('/Js/cart.js');
          const cart = await getCart(user.$id);
          updateCartBadge(cart.count);
          showToast(`Added ${qty} item(s) to cart! 🛒`);
        } catch (err) { showToast(err.message || 'Failed to add', 'error'); }
        btn.disabled = false; btn.textContent = '🛒 Add to Cart';
      });

      // Buy now
      document.getElementById('buy-now-btn').addEventListener('click', async () => {
        if (!user) { window.location.href = `/login.html?redirect=/checkout.html`; return; }
        const { addToCart } = await import('/Js/appwrite.js');
        const { clearCartCache } = await import('/Js/cart.js');
        await addToCart(user.$id, product.$id, qty);
        clearCartCache();
        window.location.href = '/checkout.html';
      });

      // Thumb click
      document.querySelectorAll('.product-thumb').forEach(thumb => {
        thumb.addEventListener('click', () => {
          document.querySelectorAll('.product-thumb').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
          document.getElementById('main-product-img').src = thumb.dataset.img;
        });
      });

      // Related products
      const relSection = document.getElementById('related-section');
      relSection.style.display = '';
      await renderProductGrid('related-products', {
        category: product.category, limit: 4, skeletons: 4,
        onAddToCart: async (id, btn) => await handleAddToCart(id, user?.$id, btn)
      });

    } catch (err) {
      container.innerHTML = '<div class="container"><div class="error-state"><p>Product not found.</p><a href="/products.html" class="btn btn-primary">Back to Products</a></div></div>';
    }

    // Search
    document.getElementById('header-search-btn').addEventListener('click', () => {
      const q = document.getElementById('header-search-input').value.trim();
      if (q) window.location.href = `/products.html?search=${encodeURIComponent(q)}`;
    });
  }
  init();
</script>
</body>
</html>
