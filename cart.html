<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — shop-X</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="/index.html" class="logo">shop<span>X</span></a>
      <div class="header-search">
        <input type="text" placeholder="Search products...">
        <button class="search-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
      </div>
      <nav class="header-nav">
        <a href="/products.html">Products</a>
        <a href="/cart.html" class="cart-link active" data-auth-show style="display:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
          Cart <span class="cart-badge" style="display:none">0</span>
        </a>
        <a href="/profile.html" data-auth-show style="display:none"><span data-user-name>Account</span></a>
        <a href="/login.html" data-guest-show>Sign In</a>
        <a href="/register.html" class="btn btn-primary btn-sm" data-guest-show>Register</a>
      </nav>
      <button class="btn-menu" id="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="/index.html" class="logo" style="margin-bottom:20px;display:block">shop<span style="color:var(--c-brand)">X</span></a>
    <a href="/products.html">🛍️ Products</a>
    <a href="/cart.html" data-auth-show style="display:none">🛒 Cart</a>
    <a href="/orders.html" data-auth-show style="display:none">📦 My Orders</a>
    <a href="/login.html" data-guest-show>🔑 Sign In</a>
    <a href="#" data-logout data-auth-show style="display:none">🚪 Logout</a>
  </div>
</div>

<div class="page-header">
  <div class="container">
    <h1>🛒 Shopping Cart</h1>
    <div class="breadcrumb"><a href="/">Home</a> › Cart</div>
  </div>
</div>

<div class="section">
  <div class="container">
    <div class="cart-layout">
      <div>
        <div id="cart-items"></div>
      </div>
      <div id="cart-summary"></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom"><span>© 2025 shop-X. All rights reserved.</span></div>
  </div>
</footer>

<script type="module">
  import { initAuth, setupLogoutButtons } from '/js/auth.js';
  import { renderCartPage, getCart } from '/js/cart.js';
  import { setupMobileMenu, setupStickyHeader, updateCartBadge } from '/js/ui.js';

  async function init() {
    setupMobileMenu();
    setupStickyHeader();
    const user = await initAuth();
    setupLogoutButtons();
    if (user) { const cart = await getCart(user.$id); updateCartBadge(cart.count); }
    await renderCartPage(user?.$id);
  }
  init();
</script>
</body>
</html>
