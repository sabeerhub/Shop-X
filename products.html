<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Admin shop-X</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-logo">shop<span>X</span><span class="admin-badge">Admin Panel</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/admin/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <div class="nav-section-label">Catalog</div>
      <a href="/admin/products.html" class="active"><span class="nav-icon">📦</span> Products</a>
      <a href="/admin/add-product.html"><span class="nav-icon">➕</span> Add Product</a>
      <div class="nav-section-label">Sales</div>
      <a href="/admin/orders.html"><span class="nav-icon">🛒</span> Orders</a>
      <div class="nav-section-label">Users</div>
      <a href="/admin/users.html"><span class="nav-icon">👥</span> Users</a>
      <div class="nav-section-label">Store</div>
      <a href="/index.html" target="_blank"><span class="nav-icon">🌐</span> View Store</a>
    </nav>
    <div class="sidebar-footer"><span data-user-name>Admin</span> • <a href="#" data-logout style="color:rgba(255,255,255,.4)">Logout</a></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <span class="topbar-title">Products Management</span>
      <div class="topbar-user">
        <div class="topbar-avatar">A</div>
        <span data-user-name>Admin</span>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-table-wrap">
        <div class="table-header">
          <span class="table-header-title">All Products</span>
          <a href="/admin/add-product.html" class="btn btn-primary">➕ Add New Product</a>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Image</th><th>Title</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Actions</th></tr>
            </thead>
            <tbody id="products-table-body">
              <tr><td colspan="7" class="table-loading">Loading products...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { initAuth, requireAdmin, setupLogoutButtons } from '/js/auth.js';
  import { renderAdminProducts } from '/js/admin.js';

  async function init() {
    await initAuth();
    if (!requireAdmin()) return;
    setupLogoutButtons();
    await renderAdminProducts();
  }
  init();
</script>
</body>
</html>
