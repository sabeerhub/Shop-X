<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — shop-X</title>
  <link rel="stylesheet" href="/Css/style.css">
  <link rel="stylesheet" href="/Css/components.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="/index.html" class="logo">shop<span>X</span></a>
      <nav class="header-nav">
        <a href="/cart.html" class="cart-link" data-auth-show style="display:none">
          🛒 Cart <span class="cart-badge" style="display:none">0</span>
        </a>
        <a href="/profile.html" data-auth-show style="display:none"><span data-user-name>Account</span></a>
      </nav>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <h1>💳 Checkout</h1>
    <div class="breadcrumb"><a href="/">Home</a> › <a href="/cart.html">Cart</a> › Checkout</div>
  </div>
</div>

<div class="section">
  <div class="container">
    <div class="checkout-layout">
      <div id="checkout-form-wrap">
        <div class="form-card">
          <h2 class="form-title">📦 Shipping Address</h2>
          <form id="checkout-form">
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" name="fullName" class="form-input" required placeholder="John Doe">
            </div>
            <div class="form-group">
              <label class="form-label">Street Address *</label>
              <input type="text" name="address" id="address" class="form-input" required placeholder="123 Main Street">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">City *</label>
                <input type="text" name="city" class="form-input" required placeholder="New York">
              </div>
              <div class="form-group">
                <label class="form-label">ZIP Code *</label>
                <input type="text" name="zip" class="form-input" required placeholder="10001">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Country *</label>
              <input type="text" name="country" class="form-input" required placeholder="United States" value="United States">
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number</label>
              <input type="tel" name="phone" class="form-input" placeholder="+1 (555) 000-0000">
            </div>

            <div style="margin-top:24px;padding:16px;background:#f0fdf4;border-radius:12px;border:1px solid #bbf7d0">
              <h3 style="font-size:15px;font-weight:700;margin-bottom:8px;color:#166534">🔒 Secure Order</h3>
              <p style="font-size:13px;color:#166534">Your order is protected. Demo mode — no real payment required.</p>
            </div>

            <div class="form-error" id="checkout-error"></div>
            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px">
              ✅ Place Order
            </button>
          </form>
        </div>
      </div>

      <div>
        <div class="summary-card" id="order-summary">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom"><span>© 2025 shop-X.</span></div>
  </div>
</footer>

<script type="module">
  import { initAuth } from '/Js/auth.js';
  import { renderCheckoutPage } from '/Js/checkout.js';
  import { getCart, updateCartBadge } from '/Js/cart.js';
  import { setupStickyHeader } from '/Js/ui.js';

  async function init() {
    setupStickyHeader();
    const user = await initAuth();
    if (!user) { window.location.href = '/login.html?redirect=/checkout.html'; return; }
    const { getCart } = await import('/Js/cart.js');
    const cart = await getCart(user.$id);
    const { updateCartBadge } = await import('/Js/ui.js');
    updateCartBadge(cart.count);
    await renderCheckoutPage(user);
  }
  init();
</script>
</body>
</html>
