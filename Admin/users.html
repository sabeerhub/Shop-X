<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users — Admin shop-X</title>
  <link rel="stylesheet" href="/Css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-logo">shop<span>X</span><span class="admin-badge">Admin Panel</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/Admin/dashboard.html"><span class="nav-icon">📊</span> Dashboard</a>
      <div class="nav-section-label">Catalog</div>
      <a href="/Admin/products.html"><span class="nav-icon">📦</span> Products</a>
      <a href="/Admin/add-product.html"><span class="nav-icon">➕</span> Add Product</a>
      <div class="nav-section-label">Sales</div>
      <a href="/Admin/orders.html"><span class="nav-icon">🛒</span> Orders</a>
      <div class="nav-section-label">Users</div>
      <a href="/Admin/users.html" class="active"><span class="nav-icon">👥</span> Users</a>
      <div class="nav-section-label">Store</div>
      <a href="/index.html" target="_blank"><span class="nav-icon">🌐</span> View Store</a>
    </nav>
    <div class="sidebar-footer"><span data-user-name>Admin</span> • <a href="#" data-logout style="color:rgba(255,255,255,.4)">Logout</a></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <span class="topbar-title">Users Management</span>
      <div class="topbar-user"><div class="topbar-avatar">A</div><span data-user-name>Admin</span></div>
    </div>

    <div class="admin-content">
      <div class="admin-table-wrap">
        <div class="table-header">
          <span class="table-header-title">Registered Users</span>
        </div>
        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr><th>Avatar</th><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr>
            </thead>
            <tbody id="users-table-body">
              <tr><td colspan="5" class="table-loading">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { initAuth, requireAdmin, setupLogoutButtons } from '/Js/auth.js';
  import { renderAdminUsers } from '/Js/admin.js';

  async function init() {
    await initAuth();
    if (!requireAdmin()) return;
    setupLogoutButtons();
    await renderAdminUsers();
  }
  init();
</script>
</body>
</html>
