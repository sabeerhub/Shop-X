<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — shop-X</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="/index.html" class="logo">shop<span>X</span></a>
      <nav class="header-nav">
        <a href="/products.html">Products</a>
        <a href="/cart.html" class="cart-link" data-auth-show style="display:none">🛒 <span class="cart-badge" style="display:none">0</span></a>
        <a href="/orders.html" data-auth-show style="display:none">Orders</a>
        <a href="/profile.html" class="active" data-auth-show style="display:none"><span data-user-name>Account</span></a>
        <a href="/login.html" data-guest-show>Sign In</a>
      </nav>
      <button class="btn-menu" id="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="/index.html">🏠 Home</a>
    <a href="/products.html">🛍️ Products</a>
    <a href="/cart.html">🛒 Cart</a>
    <a href="/orders.html">📦 Orders</a>
    <a href="/profile.html">👤 Profile</a>
    <a href="#" data-logout>🚪 Logout</a>
  </div>
</div>

<div class="page-header">
  <div class="container">
    <h1>👤 My Profile</h1>
    <div class="breadcrumb"><a href="/">Home</a> › Profile</div>
  </div>
</div>

<div class="section">
  <div class="container container-sm">
    <div id="profile-content">
      <div class="loading-spinner"></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom"><span>© 2025 shop-X. All rights reserved.</span></div>
  </div>
</footer>

<script type="module">
  import { initAuth, requireAuth, setupLogoutButtons } from '/js/auth.js';
  import { updateUserProfile } from '/js/appwrite.js';
  import { getCart } from '/js/cart.js';
  import { setupMobileMenu, setupStickyHeader, updateCartBadge, showToast } from '/js/ui.js';

  async function init() {
    setupMobileMenu();
    setupStickyHeader();
    const user = await initAuth();
    setupLogoutButtons();

    if (!requireAuth()) return;

    if (user) {
      const cart = await getCart(user.$id);
      updateCartBadge(cart.count);
    }

    const container = document.getElementById('profile-content');
    const initials = (user.name || 'U').split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);

    container.innerHTML = `
      <div class="profile-card">
        <div class="profile-avatar">${initials}</div>
        <h2 style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:4px">${user.name}</h2>
        <p style="color:#6b7280;margin-bottom:8px">${user.email}</p>
        <span class="tag tag-brand" style="margin-bottom:24px">${user.role || 'user'}</span>

        <div class="divider"></div>

        <h3 style="font-weight:700;margin-bottom:16px">Edit Profile</h3>
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-input" value="${user.name || ''}" placeholder="Your full name">
          </div>
          <div class="form-group">
            <label class="form-label">Delivery Address</label>
            <textarea name="address" class="form-input" rows="3" placeholder="Your default delivery address">${user.address || ''}</textarea>
          </div>
          <div class="form-error" id="profile-error"></div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="/orders.html" class="btn btn-ghost">📦 My Orders</a>
            <button type="button" data-logout class="btn btn-ghost" style="color:#ef4444;border-color:#fecaca">🚪 Logout</button>
          </div>
        </form>
      </div>`;

    setupLogoutButtons();

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('[type="submit"]');
      btn.disabled = true; btn.textContent = 'Saving...';
      const name = e.target.querySelector('[name="name"]').value;
      const address = e.target.querySelector('[name="address"]').value;
      try {
        await updateUserProfile(user.$id, { name, address });
        showToast('Profile updated!');
      } catch (err) {
        document.getElementById('profile-error').textContent = err.message || 'Failed to update profile.';
      }
      btn.disabled = false; btn.textContent = 'Save Changes';
    });
  }
  init();
</script>
</body>
</html>
